{% if user.is_authenticated %}
<nav class="topbar">
    <a href="{% url 'dashboard' %}" class="topbar-brand">🚗 Gestão de Frotas</a>
    <div class="topbar-nav">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'home' %}">Veículos</a>
        <a href="{% url 'relatorios' %}">Relatórios</a>
    </div>
    <div class="topbar-user">
        <span>Olá, {{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary btn-small">Sair</button>
        </form>
    </div>
</nav>
{% endif %}
