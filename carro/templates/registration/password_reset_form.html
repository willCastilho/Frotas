{% extends "head.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/formulario.css' %}">
<div class="container">
    <div class="form-header"><h1>Recuperar senha</h1>
        <p style="color:var(--text-muted)">Informe seu e-mail e enviaremos um link para redefinir a senha.</p>
    </div>
    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for erro in field.errors %}<span class="field-error">{{ erro }}</span>{% endfor %}
                </div>
            {% endfor %}
            <div class="form-actions">
                <a href="{% url 'login' %}" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-primary">Enviar link</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
