{% extends "head.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/formulario.css' %}">

<div class="container">
    <div class="form-header">
        <h1>🚗 Entrar</h1>
    </div>

    {% if form.errors %}
        <div class="alert alert-error">
            Usuário ou senha inválidos. Tente novamente.
        </div>
    {% endif %}

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>
        <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:.9rem;">
            <a href="{% url 'password_reset' %}">Esqueci a senha</a>
            <a href="{% url 'cadastro' %}">Criar conta</a>
        </div>
    </div>
</div>
{% endblock content %}
