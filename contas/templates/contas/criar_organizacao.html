{% extends "head.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/formulario.css' %}">

<div class="container">
    <div class="form-header">
        <h1>Criar organização</h1>
        <p style="color:var(--text-muted)">Precisamos de uma organização para isolar os dados da sua frota.</p>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for erro in field.errors %}<span class="field-error">{{ erro }}</span>{% endfor %}
                </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Criar e continuar</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
